<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentient Astro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='sentient_logo.png') }}" class="logo" alt="Sentient Logo">
    <h1>Sentient Astro</h1>
  </header>

  <main class="astro-container">
    <section class="card">
      <h2>Bilgilerini Gir</h2>
      <input type="text" id="name" placeholder="İsim">
      <input type="date" id="dob" placeholder="Doğum Tarihi">
      <input type="time" id="time" placeholder="Doğum Saati">
      <input type="text" id="place" placeholder="Doğum Yeri">
      <button onclick="analyze()">Analizi Oluştur</button>
    </section>

    <section class="card">
      <h2>Günlük Burç Yorumu</h2>
      <p id="daily">-</p>
    </section>

    <section class="card">
      <h2>Kişisel Enerji Grafiği</h2>
      <p id="biorhythm">-</p>
    </section>

    <section class="card">
      <h2>Dobly Yorumu 🐾</h2>
      <img src="{{ url_for('static', filename='dobly.png') }}" class="dobly-img" alt="Dobly">
      <p id="dobly">-</p>
    </section>
  </main>

  <script>
    async function analyze() {
      const name = document.getElementById("name").value;
      const dob = document.getElementById("dob").value;
      const time = document.getElementById("time").value;
      const place = document.getElementById("place").value;

      const res = await fetch("https://sentient-astro-final.onrender.com/api/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ name, dob, time, place, lang: "tr" })
      });
      
      const data = await res.json();
      if (data.ok) {
        document.getElementById("daily").innerText = data.data.Daily.text;
        document.getElementById("biorhythm").innerText = `Fiziksel: ${data.data.Biorhythm.physical}% | Duygusal: ${data.data.Biorhythm.emotional}% | Zihinsel: ${data.data.Biorhythm.mental}%`;
        document.getElementById("dobly").innerText = data.data.Insight;
      }
    }
  </script>
</body>
</html>
