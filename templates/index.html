<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentient Astro Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='sentient_logo.png') }}" alt="Sentient Logo" class="logo">
    <h1>Sentient Astro</h1>
  </header>

  <section class="astro-container">
    <div class="card input-card">
      <h2>Bilgilerini Gir</h2>
      <input id="name" placeholder="İsim" />
      <input id="dob" type="date" />
      <input id="time" type="time" />
      <input id="place" placeholder="Doğum Yeri" />
      <button id="analyze">Analizi Oluştur</button>
    </div>

    <div class="card">
      <h2>Günlük Burç Yorumu</h2>
      <p id="day-tip">-</p>
    </div>

    <div class="card">
      <h2>Kişisel Enerji Grafiği</h2>
      <div id="bio"></div>
    </div>

    <div class="card">
      <h2>Dobly Yorumu 🐾</h2>
      <img src="{{ url_for('static', filename='dobly.png') }}" class="dobly-img" />
      <p id="dobly-text">-</p>
    </div>
  </section>

  <script>
    document.getElementById("analyze").addEventListener("click", async () => {
      const data = {
        name: document.getElementById("name").value,
        dob: document.getElementById("dob").value,
        time: document.getElementById("time").value,
        place: document.getElementById("place").value,
        lang: "tr"
      };
      const res = await fetch("https://sentient-astro-final.onrender.com/api/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      const out = await res.json();
      if(out.ok){
        document.getElementById("day-tip").innerText = out.data.Yorum;
        document.getElementById("bio").innerText =
          `Fiziksel: ${out.data.Biyoritim.Fiziksel}% | Duygusal: ${out.data.Biyoritim.Duygusal}% | Zihinsel: ${out.data.Biyoritim.Zihinsel}%`;
        document.getElementById("dobly-text").innerText = out.data.Dobly;
      }
    });
  </script>
</body>
</html>
