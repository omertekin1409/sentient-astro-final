<script>
function apiBase() {
  return (location.hostname.includes("render.com"))
    ? "https://sentient-astro-final.onrender.com"
    : "http://127.0.0.1:5000";
}

function elementColor(element) {
  switch (element) {
    case "Ateş": return "fire";
    case "Toprak": return "earth";
    case "Hava": return "air";
    case "Su": return "water";
    default: return "neutral";
  }
}

function sunCardHTML(sign, element, modality) {
  const cls = elementColor(element);
  const icons = {
    "Koç":"♈", "Boğa":"♉", "İkizler":"♊", "Yengeç":"♋", "Aslan":"♌", "Başak":"♍",
    "Terazi":"♎", "Akrep":"♏", "Yay":"♐", "Oğlak":"♑", "Kova":"♒", "Balık":"♓"
  };
  return `
    <div class="sun-card ${cls}">
      <div class="emoji">${icons[sign] || "☀️"}</div>
      <div class="text">
        <h2>${sign}</h2>
        <p>${element} Elementi • ${modality} Burcu</p>
      </div>
    </div>`;
}

async function analyze() {
  const name = document.getElementById("name").value.trim();
  const dob  = document.getElementById("dob").value;
  const time = document.getElementById("time").value;
  const place= document.getElementById("place").value.trim();
  const lang = document.getElementById("lang").value;

  if (!name || !dob) {
    alert("İsim ve doğum tarihini girmen gerekiyor.");
    return;
  }

  const payload = { name, dob, time, place, lang };
  const cards = document.getElementById("cards");
  cards.innerHTML = `<p>Hesaplanıyor... 🔮</p>`;

  try {
    const r = await fetch(`${apiBase()}/api/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (!j.ok) throw new Error("API hatası");
    const d = j.data;

    const astro = d["Astroloji"];
    const sunCard = sunCardHTML(astro.burc, astro.element, astro.modalite);

    // Eski kartları koruyarak, en üste bu kartı koy
    cards.innerHTML = `
      ${sunCard}
      <div class="result-card">
        <h2>🌞 Astroloji</h2>
        <p><b>Burç:</b> ${astro.burc} | <b>Element:</b> ${astro.element} | <b>Modalite:</b> ${astro.modalite}</p>
        <p>${astro.text}</p>
      </div>
      <div class="result-card">
        <h2>🔢 Numeroloji</h2>
        <p>Yaşam Yolu: ${d["Numeroloji"]["Yaşam Yolu"]} |
        Kader: ${d["Numeroloji"]["Kader"]} |
        Ruh: ${d["Numeroloji"]["Ruh"]} |
        Kişilik: ${d["Numeroloji"]["Kişilik"]}</p>
      </div>
      <div class="result-card">
        <h2>⚙️ Biyoritim</h2>
        <p>Fiziksel: ${d["Biyoritim"]["Fiziksel"]}% |
        Duygusal: ${d["Biyoritim"]["Duygusal"]}% |
        Zihinsel: ${d["Biyoritim"]["Zihinsel"]}%</p>
      </div>
      <div class="result-card">
        <h2>📆 Dönüm Noktaları</h2>
        <p>${d["Yaş & Dönüm Noktaları"]["text"]}</p>
      </div>
      <div class="result-card">
        <h2>🐉 Çin Burcu</h2>
        <p>${d["Çin Burcu"]["text"]}</p>
      </div>
      <div class="result-card">
        <h2>🪄 Günlük Rehber</h2>
        <p>${d["Günlük"]["text"]}</p>
      </div>
      <div class="result-card">
        <h2>💡 Sentient Yorumu</h2>
        <p>${d["Yorum"]}</p>
        <p class="callout">${d["Öneri"]}</p>
      </div>
    `;
  } catch (err) {
    cards.innerHTML = `<p>🚨 Hata: ${err.message}</p>`;
  }
}
</script>
